<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cổng Nhân sự Vegas Group</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#8b1a33">
<style>
html,body{margin:0;height:100%;background:#f8f0f3;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
.fallback{position:fixed;inset:auto 0 12px;text-align:center;font:13px system-ui,sans-serif;color:#6b4a57;z-index:-1}
.fallback a{color:#8b1a33}
</style>
</head>
<body>
<p class="fallback">Đang mở Cổng Nhân sự… Nếu không hiện, <a href="https://script.google.com/macros/s/AKfycbyHmMAtOxa7DDv5kYE1Y-Al8uLskgEk2fzC7ho-_huiEwYqGaPMasmWbTOCiIIAOByv/exec">bấm vào đây</a>.</p>
<iframe id="app" title="Cổng Nhân sự Vegas Group" allow="clipboard-read; clipboard-write; fullscreen; camera; geolocation"></iframe>
<script>
(function(){
// Chặn phóng to bằng cử chỉ (iOS Safari bỏ qua user-scalable=no)
["gesturestart","gesturechange"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
var EXEC="https://script.google.com/macros/s/AKfycbyHmMAtOxa7DDv5kYE1Y-Al8uLskgEk2fzC7ho-_huiEwYqGaPMasmWbTOCiIIAOByv/exec";
// Mục trong web (#…) ↔ địa chỉ dễ đọc
var ROUTES={"overview":"/tong-quan","profiles":"/nhan-su","departments":"/phong-ban","reports":"/bao-cao-de-xuat","leave":"/giam-sat/cham-cong/nghi-phep","checklist":"/giam-sat/cham-cong/checklist-ca","communications-media":"/truyen-thong/team-media","communications-care":"/truyen-thong/hotline","communications-content":"/truyen-thong/team-content","wh-in":"/kho-hang-hoa/nhap-hang","wh-out":"/kho-hang-hoa/xuat-hang","wh-stock":"/kho-hang-hoa/luu-kho","wh-manage":"/kho-hang-hoa/quan-ly-kho","wh-comp":"/kho-hang-hoa/den-kho","wh-standard":"/kho-hang-hoa/quy-chuan","wh-sales":"/kho-hang-hoa/ban-hang","wh-audit":"/kho-hang-hoa/kiem-kho","branch-vg1":"/chi-nhanh/co-so-1","branch-vg2":"/chi-nhanh/co-so-2","branch-kld":"/chi-nhanh/co-so-3","payroll-issue":"/ke-toan/gui-phieu-luong","payroll":"/ke-toan/bang-luong","booking":"/ke-toan/booking","bod-vg1":"/bao-cao-bgd/chi-nhanh-1","bod-vg2":"/bao-cao-bgd/chi-nhanh-2","bod-kld":"/bao-cao-bgd/chi-nhanh-3","system":"/cai-dat","system/accounts":"/cai-dat/tai-khoan","system/import":"/cai-dat/nhap-tai-khoan","system/permissions":"/cai-dat/phan-quyen","system/activity":"/cai-dat/nhat-ky","system/connection":"/cai-dat/ket-noi","debts":"/ke-toan/no-bao-lanh","sv-attendance":"/giam-sat/cham-cong","sv-tips":"/giam-sat/bao-cao/tien-tips","sv-fruit":"/giam-sat/bao-cao/trai-cay","sv-minutes":"/giam-sat/bao-cao/bien-ban","sv-turns":"/giam-sat/bao-cao/tua-cskh","procedures":"/chi-nhanh/quy-trinh"};
var BACK={};Object.keys(ROUTES).forEach(function(k){BACK[ROUTES[k]]=k;});
function toPath(hash){
  var h=String(hash||'').replace(/^#\/?/,'');if(!h)return '/';
  if(ROUTES[h])return ROUTES[h];
  var m=/^employee\/([A-Za-z0-9_-]+)$/.exec(h);if(m)return '/nhan-su/'+m[1];
  return ROUTES[h.split('/')[0]]||'/';
}
function toHash(path){
  try{path=decodeURIComponent(path);}catch(x){}
  path=path.replace(/\/+$/,'')||'/';
  if(BACK[path])return BACK[path];
  var m=/^\/nhan-su\/([A-Za-z0-9_-]+)$/.exec(path);if(m)return 'employee/'+m[1].toUpperCase();
  return '';
}
var start=toHash(location.pathname);
document.getElementById('app').src=EXEC+(start?'?route='+encodeURIComponent(start):'');
addEventListener('message',function(e){
  var host='';try{host=new URL(e.origin).hostname;}catch(x){}
  if(!/\.googleusercontent\.com$/.test(host))return;
  var d=e.data;if(!d||d.type!=='vegas-hr-route')return;
  var p=['login','setup','change'].indexOf(d.screen)>=0?'/dang-nhap':toPath(d.hash);
  if(location.pathname!==p||location.search)history.replaceState(null,'',p);
});
addEventListener("message",function(e){
  var host="";try{host=new URL(e.origin).hostname;}catch(x){}
  if(!/\.googleusercontent\.com$/.test(host))return;var d=e.data;if(!d||d.type!=="vegas-capture")return;
  e.source.postMessage({type:"vegas-capture-ack",id:d.id},e.origin);
  window.VegasCapture.run(d.opts||{}).then(function(r){e.source.postMessage({type:"vegas-capture-result",id:d.id,data:r},e.origin);},function(err){e.source.postMessage({type:"vegas-capture-result",id:d.id,error:err.message},e.origin);});
});
})();
</script>
<script src="/capture.js?v=2"></script>
</body>
</html>
